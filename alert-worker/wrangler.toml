name = "whale-alert"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true # chỉ mở link chỉ-đọc /history (số tổng gom/xả theo ngày) cho GitHub Actions
preview_urls = false

[observability]
enabled = true # xem log trong dashboard: whale-alert > Observability

# Durable Object chạy việc quét, ghim ở châu Á để không bị Binance/Bybit chặn.
[[durable_objects.bindings]]
name = "SCANNER"
class_name = "Scanner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scanner"]

[triggers]
crons = ["* * * * *"] # chạy mỗi phút

[vars]
# Coin:ngưỡng (USDT), cách nhau bằng dấu phẩy. Sửa xong chạy lại: npx wrangler deploy
COINS ="BTC:500000,ETH:500000,ARB:10000,APT:10000,FET:10000,OP:10000,TIA:10000,LDO:10000,BICO:10000"
# Quét thêm sàn phụ cho coin giao dịch mạnh ở sàn khác (bybit, coinbase, okx). Ngưỡng lấy theo COINS.
EXTRA = "TIA:bybit,FET:coinbase"
# Báo khi giá chạm mức Pivot. Khung: d=ngày, w=tuần, m=tháng, y=năm (bỏ "d" nếu thấy báo quá nhiều).
PIVOT_FRAMES = "d,w,m,y"
PIVOT_LEVELS = "R3,R2,R1,P,S1,S2,S3"
PIVOT_GOLD = "1" # 1 = báo cả vàng (XAUUSDT), 0 = tắt
NEWS_REMIND = "1" # 1 = nhắc trước 30 phút khi có tin Mỹ mạnh (CPI, việc làm, Fed...), 0 = tắt
# Theo dõi kịch bản sóng Elliott BTC: "W0,W1,W2,W3" = đỉnh đầu sóng C, đáy sóng 1, đỉnh sóng 2, đáy sóng 3 (giá Binance).
# Số thứ 5 (tùy chọn) = đỉnh sóng 4 nhỏ của cách đếm phụ "sóng C đã xong ở W3": vượt mức này bot báo sớm.
# Đổi 4 số đầu là bot theo dõi lại từ đầu. Đặt "0" để tắt.
ELLIOTT_BTC = "87395.67,75736.38,81196.01,55130,66132"
# Kế hoạch danh mục: "COIN:sell|keep:mức,...:mức_cắt;..." (giá Binance USDT). Đặt "0" để tắt.
#   sell = coin yếu, bán khi hồi lên từng vùng rồi chuyển sang BTC; mức cắt = nến ngày đóng dưới thì bán luôn.
#   keep = coin giữ, mua DCA từng phần nhỏ ở các vùng; mức cắt = nến tuần đóng dưới thì cắt chuyển BTC.
#   Bán xong coin nào thì xóa coin đó khỏi danh sách rồi chạy lại: npx wrangler deploy
PLAN = "BICO:sell:0.0108,0.0118:0.0091;APT:sell:0.41,0.46:0.325;OP:sell:0.078,0.085:0.062;FET:sell:0.118,0.132:0.1005;LDO:keep:0.21,0.19,0.175:0.155;ARB:keep:0.1,0.09,0.083:0.0705;TIA:keep:0.3,0.27,0.245:0.22"
# Kế hoạch mua BTC từng phần bằng USDT bán altcoin: "vùng1,vùng2,vùng3:mức_xác_nhận". Đặt "0" để tắt.
#   Chạm vùng nào nhắc mua phần đó; nến tuần đóng trên mức xác nhận (đáy sóng C có thể đã xong) thì nhắc mua nốt.
BTC_BUY = "55500,51500,48000:66132"
