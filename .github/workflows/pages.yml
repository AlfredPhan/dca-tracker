# Mỗi giờ (và mỗi lần push): tạo dữ liệu unlock + on-chain rồi deploy website lên GitHub Pages.
name: Build data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data
        run: node scripts/build-data.mjs
        env:
          BOT_HISTORY_URL: ${{ secrets.BOT_HISTORY_URL }} # link chỉ-đọc /history của bot (để trong secret cho khỏi lộ)
        continue-on-error: true
        timeout-minutes: 15
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub thỉnh thoảng lỗi tạm thời ("Fetching artifact metadata failed"): chờ 60 giây rồi thử lại 1 lần.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Chờ rồi thử lại
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
